<style>
:root{--bg:#090c12;--panel:#11151d;--panel2:#171c26;--line:#252b37;--text:#f3f2ed;--muted:#969dab;--gold:#dfb45a;--gold2:#f5d88e;--teal:#72d7c4;--red:#e87378}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.shell{max-width:1480px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:26px 15px;background:#0d1016;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 12px 30px}.brand-mark{width:38px;height:38px;border:1px solid #a88648;border-radius:11px;display:grid;place-items:center;color:var(--gold2);background:#232119}.brand strong{font-size:12px;letter-spacing:.15em}.brand small{display:block;color:var(--muted);font-size:9px}.nav-label{color:#69717e;font-size:9px;font-weight:800;letter-spacing:.16em;padding:10px 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:9px;color:#adb3bd;display:flex;align-items:center;gap:12px}.nav button.active,.nav button:hover{background:#1b2029;color:white}.nav button.active{box-shadow:inset 2px 0 var(--gold)}.ico{width:18px;text-align:center}.side-bottom{margin-top:auto}.season-mini{margin:12px 4px 15px;padding:14px;border:1px solid #42392a;border-radius:12px;background:#181914}.bar{height:5px;border-radius:5px;background:#30343c;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#b58c43,var(--gold2))}.main{min-width:0;padding:25px 34px 35px}.topbar{height:44px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}.topbar-actions{display:flex;align-items:center;gap:9px}.icon-btn,.lang-btn{height:36px;border:1px solid var(--line);border-radius:9px;background:#12161e}.lang-btn{padding:0 10px;font-size:11px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#8b7445,#3a3030);border:1px solid #a88a55;font-size:12px}.hero{position:relative;min-height:250px;border:1px solid #353b48;border-radius:16px;padding:36px 38px;overflow:hidden;background:radial-gradient(circle at 85% 45%,#8d6d3629,transparent 24%),linear-gradient(130deg,#171b23,#1b1d22 58%,#252019)}.eyebrow{color:var(--gold);font-size:9px;font-weight:800;letter-spacing:.17em}.hero h1{font-family:Georgia,serif;font-size:39px;line-height:1.08;margin:12px 0}.hero p{color:#b1b5bd;max-width:490px;margin:0 0 22px}.button{border:1px solid #454c59;border-radius:9px;background:#202630;padding:10px 14px;font-weight:700;font-size:11px}.button.primary{border-color:#d1a957;background:linear-gradient(180deg,#dcb96f,#b88d42);color:#16130d}.button.gold{border-color:#806835;background:#29241b;color:var(--gold2)}.button.teal{border-color:#44766f;background:#1a302d;color:#a8eadc}.section-head{display:flex;justify-content:space-between;align-items:end;margin:24px 0 13px}.section-head h2{font-family:Georgia,serif;margin:0;font-size:18px}.section-head small{color:var(--muted)}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:17px}.stack{display:grid;gap:17px}.rank-card{min-height:184px;border:1px solid #383d48;border-radius:15px;padding:19px;background:linear-gradient(135deg,#171b24,#12151b);display:grid;grid-template-columns:94px 1fr}.rank-emblem{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;border:2px solid #b99a51;box-shadow:0 0 0 7px #b99a5111;font-size:43px;background:linear-gradient(145deg,#403a2b,#1a1d23)}.rank-info h2{margin:4px 0 2px;font-family:Georgia,serif}.rank-info small{color:var(--muted)}.rank-points{display:flex;justify-content:space-between;margin-top:20px}.rank-points b{font-size:22px;color:var(--gold2)}.rank-points span{font-size:10px;color:var(--muted)}.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px}.stat small{color:var(--muted);display:block;font-size:9px}.stat b{font-size:18px}.card h3{margin:0 0 12px;font-family:Georgia,serif;font-size:14px}.guild-mini{display:flex;align-items:center;gap:12px}.guild-crest{width:50px;height:50px;border-radius:12px;background:#26271c;border:1px solid #76683e;display:grid;place-items:center;font-size:23px}.guild-mini b,.friend-row b{display:block;font-size:11px}.guild-mini small,.friend-row small{color:var(--muted);font-size:9px}.friend-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #222731}.friend-row>div:nth-child(2){flex:1}.online{width:7px;height:7px;border-radius:50%;background:#71c89c}.pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.champion{border:1px solid var(--line);border-radius:12px;background:#121720;padding:9px;text-align:left}.champion.active{border-color:var(--gold);background:#252218}.champ-icon{height:78px;border-radius:8px;display:grid;place-items:center;font-size:34px;background:linear-gradient(145deg,#343b3c,#1b2027)}.champion b{display:block;font-size:11px;margin-top:7px}.champion small{color:var(--muted);font-size:9px}.play-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.72fr);gap:17px}.arena{border:1px solid #303642;border-radius:15px;overflow:hidden;background:#10151b}.arena-top{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #262c36}.battlefield{height:350px;perspective:700px;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:25px;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#2f5a3f 0 12%,#18372d 13% 28%,transparent 29%),linear-gradient(135deg,#141f1c,#26352e 48%,#171d25)}.battlefield:before{content:"";position:absolute;inset:35px 12%;border:2px solid #a4b18330;border-radius:50%;transform:rotateX(55deg);box-shadow:0 20px 35px #0008}.tower{position:absolute;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:#323728;border:2px solid #a99a62;z-index:2}.tower.left{left:8%;top:44%}.tower.right{right:8%;top:44%}.castle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) perspective(300px) rotateX(20deg);font-size:62px;filter:drop-shadow(0 12px 12px #000);z-index:1}.fighter{position:relative;z-index:3;display:flex;align-items:center;gap:11px}.fighter.enemy{align-self:flex-end;flex-direction:row-reverse;text-align:right}.fighter-portrait{width:57px;height:57px;border-radius:14px;display:grid;place-items:center;font-size:29px;border:1px solid #b08d4e66;background:#302e27}.fighter-detail{width:220px}.fighter-label{font-size:10px;font-weight:800}.health{height:6px;border-radius:6px;background:#30343c;overflow:hidden;margin:5px 0}.health i{display:block;height:100%;width:100%;background:#77c69a;transition:.3s}.enemy .health i{background:#df8075}.action-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:11px}.action-row .button{padding:10px 5px}.log{height:235px;overflow:auto}.log-line{padding:8px 0;border-bottom:1px solid #242a33;font-size:10px;color:#adb4bf}.guild-banner{padding:24px;border:1px solid #423a2b;border-radius:15px;margin-bottom:16px;background:linear-gradient(130deg,#1d1b18,#171a22);display:flex;justify-content:space-between}.guild-grid,.chat-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.member-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #252b34}.member-row>div:nth-child(2){flex:1}.role{font-size:9px;color:var(--gold);padding:4px 7px;background:#29251d;border-radius:6px}.tutorial-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.lesson{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:16px;display:flex;gap:12px}.lesson-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#29251c;color:var(--gold2);flex:none}.lesson h3{margin:2px 0;font-size:13px}.lesson p{margin:6px 0 0;color:var(--muted);font-size:11px}.chat-tabs{display:flex;gap:7px;margin-bottom:10px}.chat-tabs button{border:1px solid var(--line);background:#171b23;padding:8px 10px;border-radius:8px}.chat-tabs button.active{border-color:var(--gold);color:var(--gold2)}.messages{height:300px;overflow:auto}.message{border-bottom:1px solid #242a33;padding:9px 0;font-size:11px}.message b{color:var(--gold2)}.chat-input{display:flex;gap:7px;margin-top:10px}.chat-input input,.modal input{width:100%;padding:10px;border-radius:8px;border:1px solid #303744;background:#0f131a;color:white}.modal-back{position:fixed;inset:0;background:#05070bd9;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal-back.show{display:flex}.modal{width:min(430px,100%);border:1px solid #414856;border-radius:15px;background:#151922;padding:20px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.25s;background:#242a33;border:1px solid #414957;border-radius:9px;padding:10px 14px;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:9px;text-transform:uppercase;padding:10px 8px;border-bottom:1px solid var(--line)}.table td{padding:13px 8px;font-size:11px;border-bottom:1px solid #222831}
@media(max-width:1050px){.shell{grid-template-columns:200px minmax(0,1fr)}.main{padding:22px}.dashboard-grid,.guild-grid,.chat-layout{grid-template-columns:1fr}.dashboard-grid>.stack,.play-layout>.stack{grid-template-columns:1fr 1fr}.play-layout{grid-template-columns:1fr}}
@media(max-width:680px){.shell{display:block;padding-bottom:62px}.sidebar{position:fixed;z-index:10;top:auto;bottom:0;height:62px;width:100%;padding:5px 8px;border:0;border-top:1px solid var(--line)}.brand,.nav-label,.side-bottom{display:none}.nav{display:flex;justify-content:space-around}.nav button{flex:1;padding:7px 3px;flex-direction:column;gap:1px;font-size:8px;text-align:center}.nav button.active{box-shadow:inset 0 2px var(--gold)}.main{padding:15px 12px 25px}.hero{min-height:215px;padding:25px 20px}.hero h1{font-size:29px}.dashboard-grid>.stack,.play-layout>.stack{grid-template-columns:1fr}.rank-card{grid-template-columns:67px 1fr;padding:13px}.rank-emblem{width:58px;height:58px;font-size:29px}.stat-row{gap:6px}.stat{padding:11px}.pick-grid{grid-template-columns:repeat(2,1fr)}.champ-icon{height:58px}.battlefield{height:300px;padding:20px 14px}.fighter-detail{width:175px}.fighter-portrait{width:48px;height:48px}.action-row{gap:5px}.action-row .button{font-size:9px}.tutorial-grid{grid-template-columns:1fr}.guild-banner{padding:18px}.topbar-actions .icon-btn{display:none}}
</style>
</head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),SNOX='riftbound-snox',SAVE='riftbound-save';
let state=JSON.parse(localStorage.getItem(SAVE)||'null')||{lp:72,wins:14,matches:25,streak:3,honor:92,guildWins:38,language:'fr',friends:['Mira','Thorne'],tutorialDone:false,account:null};
let page='home',selected=0,battle=null,chatChannel='world',chatHistory=JSON.parse(localStorage.getItem('riftbound-chat')||'null')||{world:[['Nova','Bienvenue à tous sur la Faille mondiale.']],clan:[['Lyra','Préparez les tours pour le prochain match.']],friends:[['Mira','On fait une partie ensemble ?']]};
const champs=[['⚔','Kael','Vanguard'],['✦','Lyra','Mage'],['♜','Orrin','Guardian'],['☄','Vex','Assassin']];
const save=()=>localStorage.setItem(SAVE,JSON.stringify(state));
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function derivePassword(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},key,256);return [...new Uint8Array(bits)].map(byte=>byte.toString(16).padStart(2,'0')).join('')}
const randomSalt=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(byte=>byte.toString(16).padStart(2,'0')).join('');
const tr={fr:{home:'Accueil',play:'Jouer',guild:'Guilde',ranked:'Classé',friends:'Amis',chat:'Tchat',tutorial:'Tutoriel',hero:'L’ascension vers l’Or commence ici.',sub:'Tactiques, tours, château impérial et entraide de guilde.',rank:'Jouer en classé',overview:'Vue de la saison',gold:'Ligue Or',promotion:'Progression',wins:'Victoires',matches:'Matchs',streak:'Série',choose:'Choisir un champion',mode:'OR II · ÉQUIPE',world:'Mondial',clan:'Clan',friend:'Amis',send:'Envoyer',complete:'Terminer le tutoriel'},en:{home:'Home',play:'Play',guild:'Guild',ranked:'Ranked',friends:'Friends',chat:'Chat',tutorial:'Tutorial',hero:'The climb to Gold begins here.',sub:'Tactics, towers, imperial castle and guild teamwork.',rank:'Play ranked',overview:'Season overview',gold:'Gold League',promotion:'Promotion progress',wins:'Wins',matches:'Matches',streak:'Win streak',choose:'Choose champion',mode:'GOLD II · TEAM',world:'World',clan:'Clan',friend:'Friends',send:'Send',complete:'Complete tutorial'}};
const t=k=>tr[state.language][k]||k;
const nav=[['home','◆'],['play','⚔'],['guild','♜'],['ranked','▲'],['friends','●'],['chat','◉'],['tutorial','?']];
function shell(content){document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">R</div><div><strong>RIFTBOUND</strong><small>SNOX WORLD</small></div></div><div class="nav-label">${state.language==='fr'?'AVENTURE':'ADVENTURE'}</div><div class="nav">${nav.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span class="ico">${i}</span><span>${t(n)}</span></button>`).join('')}</div><div class="side-bottom"><div class="season-mini"><small>SEASON 4</small><b style="display:block;margin:4px 0;color:var(--gold2)">${t('gold')}</b><div class="bar"><i style="width:${state.lp}%"></i></div></div></div></aside><main class="main"><header class="topbar"><div></div><div class="topbar-actions"><button class="lang-btn" onclick="toggleLang()">${state.language==='fr'?'EN':'FR'}</button><button class="icon-btn" onclick="openSnox()" title="SNOX ID">ID</button><div class="avatar" onclick="openSnox()">${esc(state.account?.name?.[0]?.toUpper()||'P')}</div></div></header>${content}</main></div>`}
function go(p){page=p;render()}function toggleLang(){state.language=state.language==='fr'?'en':'fr';save();render()}function toast(m){let e=$('.toast')||document.body.appendChild(Object.assign(document.createElement('div'),{className:'toast'})),el=$('.toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000)}
function home(){return `<section class="hero"><div class="eyebrow">${state.account?'SNOX ID · '+esc(state.account.name):(state.language==='fr'?'BIENVENUE, JOUEUR':'WELCOME, PLAYER')}</div><h1>${t('hero')}</h1><p>${t('sub')}</p><button class="button primary" onclick="go('play')">${t('rank')} →</button></section><div class="section-head"><h2>${t('overview')}</h2></div><div class="dashboard-grid"><div class="stack"><div class="rank-card"><div class="rank-emblem">◆</div><div class="rank-info"><small>${t('gold')}</small><h2>${state.language==='fr'?'Or II':'Gold II'}</h2><div class="rank-points"><b>${state.lp} LP</b><span>${t('promotion')}</span></div><div class="bar" style="margin-top:9px"><i style="width:${state.lp}%"></i></div></div></div><div class="stat-row"><div class="stat"><small>${t('wins')}</small><b>${state.wins}</b></div><div class="stat"><small>${t('matches')}</small><b>${state.matches}</b></div><div class="stat"><small>${t('streak')}</small><b>${state.streak}</b></div></div></div><div class="stack"><div class="card"><h3>${state.language==='fr'?'Les Wyrms dorés':'The Golden Wyrms'}</h3><div class="guild-mini"><div class="guild-crest">♜</div><div><b>${state.language==='fr'?'Guilde niveau 12':'Guild level 12'}</b><small>48 ${state.language==='fr'?'membres':'members'} · ${state.guildWins} ${state.language==='fr'?'victoires':'wins'}</small></div></div><button class="button gold" style="margin-top:14px;width:100%" onclick="go('guild')">${state.language==='fr'?'Voir la guilde':'View guild'}</button></div><div class="card"><h3>${state.language==='fr'?'Tchat mondial':'World chat'}</h3><p style="color:var(--muted);font-size:11px">${state.language==='fr'?'Discute avec le clan, les amis ou le monde.':'Chat with the clan, friends or the world.'}</p><button class="button teal" style="width:100%" onclick="go('chat')">${state.language==='fr'?'Ouvrir le tchat':'Open chat'}</button></div></div></div>`}
function play(){if(!battle)battle={hp:100,ehp:100,towers:[100,100],castle:100,turn:1,minutes:0,log:[state.language==='fr'?'Match lancé — objectif : défendre ou prendre le château.':'Match started — defend or assault the castle.']};return `<div class="section-head"><h2>${state.language==='fr'?'Arène classée 3D':'3D Ranked Arena'}</h2><small>${t('mode')} · ${battle.minutes}:00 / 10:00</small></div><div class="section-head" style="margin-top:0"><small>${t('choose')}</small></div><div class="pick-grid">${champs.map((c,i)=>`<button class="champion ${selected===i?'active':''}" onclick="pick(${i})"><div class="champ-icon">${c[0]}</div><b>${c[1]}</b><small>${c[2]}</small></button>`).join('')}</div><div class="play-layout" style="margin-top:15px"><div class="arena"><div class="arena-top"><small>GOLD ARENA · 5V5</small><span style="color:${battle.finished?'#969dab':'#ed8884'}">● ${battle.finished?(state.language==='fr'?'TERMINÉ':'FINISHED'):'LIVE'}</span></div><div class="battlefield"><div class="tower left">🏰</div><div class="castle">♛</div><div class="tower right">🏰</div><div class="fighter"><div class="fighter-portrait">${champs[selected][0]}</div><div class="fighter-detail"><div class="fighter-label">${champs[selected][1]} · ${state.language==='fr'?'Vous':'You'}</div><div class="health"><i style="width:${battle.hp}%"></i></div><small>${battle.hp}/100 HP</small></div></div><div class="fighter enemy"><div class="fighter-portrait">☠</div><div class="fighter-detail"><div class="fighter-label">Empire · ${battle.towers[0]>0?(state.language==='fr'?'Tour':'Tower')+' '+battle.towers[0]+'%':(state.language==='fr'?'Château exposé':'Castle exposed')}</div><div class="health"><i style="width:${battle.castle}%"></i></div><small>${state.language==='fr'?'Château impérial':'Imperial castle'} · ${battle.castle}%</small></div></div></div><div class="action-row"><button class="button" onclick="combat(0)" ${battle.finished?'disabled':''}>${state.language==='fr'?'Attaquer':'Strike'}</button><button class="button" onclick="combat(1)" ${battle.finished?'disabled':''}>${state.language==='fr'?'Défense':'Guard'}</button><button class="button" onclick="combat(2)" ${battle.finished?'disabled':''}>${state.language==='fr'?'Tour':'Tower'}</button><button class="button gold" onclick="combat(3)" ${battle.finished?'disabled':''}>${state.language==='fr'?'Château':'Castle'}</button></div></div><div class="card"><h3>${state.language==='fr'?'Journal du combat':'Combat log'}</h3><div class="log">${battle.log.map(x=>`<div class="log-line">${x}</div>`).join('')}</div><button class="button" style="width:100%;margin-top:9px" onclick="battle=null;render()">${state.language==='fr'?'Nouvelle partie':'New match'}</button></div></div>`}
function pick(i){selected=i;battle=null;render()}function combat(a){if(!battle||battle.finished)return;const dmg=[14,2,24,38][a];if(a===1){battle.hp=Math.min(100,battle.hp+10);battle.log.unshift(state.language==='fr'?'Défense activée. +10 HP':'Guard active. +10 HP')}else if(a===2){battle.towers[0]=Math.max(0,battle.towers[0]-dmg);battle.log.unshift((state.language==='fr'?'Tour ennemie attaquée : -':'Enemy tower attacked: -')+dmg+' · '+battle.towers[0]+' HP')}else if(battle.towers[0]>0){battle.log.unshift(state.language==='fr'?'La tour ennemie protège encore le château !':'The enemy tower still protects the castle!')}else{battle.castle=Math.max(0,battle.castle-dmg);battle.log.unshift((state.language==='fr'?'Assaut sur le château : -':'Castle assault: -')+dmg)}const enemy=a===1?4:7+Math.floor(Math.random()*10);battle.hp=Math.max(0,battle.hp-enemy);battle.minutes=Math.min(10,battle.minutes+1);battle.turn++;if(battle.castle<=0||battle.minutes>=10||battle.hp<=0){finish(battle.castle<=0)}render()}function finish(win){if(!battle||battle.finished)return;battle.finished=true;state.matches++;if(win){state.wins++;state.lp=Math.min(100,state.lp+18);state.guildWins++;state.streak++;battle.log.unshift(state.language==='fr'?'Victoire impériale ! +18 LP':'Imperial victory! +18 LP')}else{state.lp=Math.max(0,state.lp-12);state.streak=0;battle.log.unshift(state.language==='fr'?'Défaite. -12 LP':'Defeat. -12 LP')}save()}
function guild(){return `<div class="guild-banner"><div><small>GUILD 12</small><h1>${state.language==='fr'?'Les Wyrms dorés':'The Golden Wyrms'}</h1><small style="color:var(--muted)">48 ${state.language==='fr'?'membres':'members'} · 38 ${state.language==='fr'?'victoires':'wins'}</small></div><button class="button gold" onclick="openModal('guild')">${state.language==='fr'?'Inviter':'Invite'}</button></div><div class="guild-grid"><div class="card"><h3>${state.language==='fr'?'Membres':'Members'}</h3>${[['Lyra','Maître de guilde','◇','En ligne'],['Thorne','Officier','◈','Dans l’arène'],['Mira','Membre','✦','En ligne'],['Orin','Membre','♜','Hors ligne']].map(m=>`<div class="member-row"><div class="avatar">${m[2]}</div><div><b>${m[0]}</b><small>${m[3]}</small></div><span class="role">${m[1]}</span></div>`).join('')}</div><div class="card"><h3>${state.language==='fr'?'Objectifs de guilde':'Guild objectives'}</h3><div class="log-line">🏰 ${state.guildWins}/50 ${state.language==='fr'?'châteaux contrôlés':'castles conquered'}</div><div class="log-line">⚔ 24/30 ${state.language==='fr'?'tours détruites':'towers destroyed'}</div><button class="button teal" style="width:100%;margin-top:12px" onclick="go('chat')">${state.language==='fr'?'Ouvrir le chat clan':'Open clan chat'}</button></div></div>`}
function friends(){return `<div class="section-head"><h2>${t('friends')}</h2><button class="button" onclick="openModal('friend')">${state.language==='fr'?'Ajouter un ami':'Add friend'}</button></div><div class="card" style="max-width:700px">${[['Mira','En classé','◆'],['Thorne','Dans l’arène','♜'],['Lyra','En ligne','✦'],...state.friends.filter(f=>!['Mira','Thorne','Lyra'].includes(f)).map(f=>[f,'En ligne','●'])].map(f=>`<div class="friend-row"><div class="avatar">${f[2]}</div><div><b>${esc(f[0])}</b><small>${f[1]}</small></div><span class="online"></span></div>`).join('')}</div>`}
function ranked(){const names=['Aurel','Seren','Thorne','Mira','Kael','Lyra'];return `<div class="section-head"><h2>${t('ranked')}</h2><small>${state.language==='fr'?'Or II':'Gold II'} · ${state.lp} LP</small></div><div class="card"><table class="table"><thead><tr><th>#</th><th>${state.language==='fr'?'Joueur':'Player'}</th><th>LP</th><th>${state.language==='fr'?'Division':'Division'}</th></tr></thead><tbody>${names.map((n,i)=>`<tr><td>${i+1}</td><td>${n}${i===3?' ('+(state.language==='fr'?'Vous':'You')+')':''}</td><td>${98-i*7}</td><td>${i<3?'Gold I':'Gold II'}</td></tr>`).join('')}</tbody></table></div>`}
function chat(){return `<div class="section-head"><h2>${t('chat')}</h2><small>SNOX · ${state.language==='fr'?'salons démo locaux':'local demo rooms'}</small></div><div class="chat-layout"><div class="card"><div class="chat-tabs"><button class="${chatChannel==='world'?'active':''}" onclick="setChat('world')">${t('world')}</button><button class="${chatChannel==='clan'?'active':''}" onclick="setChat('clan')">${t('clan')}</button><button class="${chatChannel==='friends'?'active':''}" onclick="setChat('friends')">${t('friend')}</button></div><div class="messages">${chatHistory[chatChannel].map(m=>`<div class="message"><b>${esc(m[0])}</b><br>${esc(m[1])}</div>`).join('')}</div><div class="chat-input"><input id="chatInput" maxlength="180" placeholder="${state.language==='fr'?'Écrire un message…':'Write a message…'}"><button class="button primary" onclick="sendChat()">${t('send')}</button></div></div><div class="card"><h3>${state.language==='fr'?'Mode démo local':'Local demo mode'}</h3><div class="log-line">🌐 ${state.language==='fr'?'Salon mondial simulé':'Simulated world room'}</div><div class="log-line">♜ ${state.language==='fr'?'Salon de guilde simulé':'Simulated guild room'}</div><div class="log-line">● ${state.language==='fr'?'Messages conservés sur cet appareil':'Messages saved on this device'}</div></div></div>`}function setChat(c){chatChannel=c;render()}function sendChat(){const i=$('#chatInput'),v=i?.value.trim();if(!v)return;chatHistory[chatChannel].push([state.account?.name||'Vous',v]);localStorage.setItem('riftbound-chat',JSON.stringify(chatHistory));render()}
function tutorial(){const lessons=state.language==='fr'?[['◆','Le champ de bataille','Repérez les tours, les routes et le château impérial.'],['⚔','Combat','Frappe, garde, aptitudes et ultime ont chacun un rôle.'],['🏰','Objectifs','Détruire les tours ouvre l’accès au château.'],['👥','Travail d’équipe','Composée avec tes coéquipiers et protège leurs flancs.'],['▲','Progression','Victoires +18 LP, défaites -12 LP ; promotion à 100 LP.'],['◉','Communication','Utilise les canaux mondial, clan et amis pour coordonner.']]:[['◆','The battlefield','Read lanes, towers and the imperial castle.'],['⚔','Combat','Strike, guard, abilities and ultimate each have a role.'],['🏰','Objectives','Destroy towers to open a path to the castle.'],['👥','Teamwork','Build with teammates and protect their flanks.'],['▲','Progression','Wins add 18 LP and losses remove 12 LP; promote at 100 LP.'],['◉','Communication','Use world, clan and friend channels to coordinate.']];return `<div class="section-head"><h2>${state.language==='fr'?'Académie du Rift':'Rift Academy'}</h2><small>${state.language==='fr'?'Formation complète 3D':'Complete 3D training'}</small></div><div class="tutorial-grid">${lessons.map(x=>`<div class="lesson"><div class="lesson-icon">${x[0]}</div><div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join('')}</div><button class="button primary" style="margin-top:16px" onclick="completeTutorial()">${t('complete')}</button>`}function completeTutorial(){state.tutorialDone=true;save();toast(state.language==='fr'?'Formation terminée !':'Training complete!')}
function openModal(kind){const guild=kind==='guild';document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="modal-back show" id="modal"><div class="modal"><h2>${guild?(state.language==='fr'?'Inviter un membre':'Invite member'):(state.language==='fr'?'Ajouter un ami':'Add friend')}</h2><input id="modalInput" placeholder="${state.language==='fr'?'Pseudo SNOX':'SNOX name'}"><div class="modal-actions"><button class="button" onclick="closeModal()">${state.language==='fr'?'Annuler':'Cancel'}</button><button class="button primary" onclick="sendInvite('${kind}')">${state.language==='fr'?'Confirmer':'Confirm'}</button></div></div></div>`)}function closeModal(){$('#modal')?.remove()}function sendInvite(kind){const v=$('#modalInput')?.value.trim();if(!v)return toast(state.language==='fr'?'Entre un pseudo':'Enter a name');if(kind==='friend'&&!state.friends.includes(v)){state.friends.push(v);save()}closeModal();if(kind==='friend')render();toast(state.language==='fr'?(kind==='friend'?'Ami ajouté':'Invitation envoyée'):(kind==='friend'?'Friend added':'Invitation sent'))}
function openSnox(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="modal-back show" id="modal"><div class="modal"><h2>SNOX ID</h2><p style="color:var(--muted)">${state.language==='fr'?'Compte de démonstration local : pseudo et empreinte du mot de passe restent dans ce navigateur, sans synchronisation serveur.':'Local demo account: username and password hash stay in this browser; there is no server sync.'}</p><input id="snoxName" placeholder="${state.language==='fr'?'Pseudo':'Username'}" value="${esc(state.account?.name||'')}"><input id="snoxPass" type="password" placeholder="${state.language==='fr'?'Mot de passe':'Password'}" style="margin-top:8px"><div class="modal-actions"><button class="button" onclick="closeModal()">${state.language==='fr'?'Annuler':'Cancel'}</button><button class="button gold" onclick="snoxLogin(false)">${state.language==='fr'?'Se connecter':'Sign in'}</button><button class="button primary" onclick="snoxLogin(true)">${state.language==='fr'?'Créer un compte':'Create account'}</button></div></div></div>`)}async function snoxLogin(create){const n=$('#snoxName')?.value.trim(),p=$('#snoxPass')?.value;if(!n||!p||p.length<8)return toast(state.language==='fr'?'Pseudo requis et mot de passe de 8 caractères minimum':'Username required and password of at least 8 characters');if(!crypto?.subtle)return toast(state.language==='fr'?'Connexion sécurisée disponible uniquement sur HTTPS ou localhost':'Secure sign-in requires HTTPS or localhost');const accounts=JSON.parse(localStorage.getItem(SNOX)||'{}'),key=Object.keys(accounts).find(name=>name.toLowerCase()===n.toLowerCase());try{if(create){if(key)return toast(state.language==='fr'?'Ce pseudo existe déjà':'That username is already taken');const salt=randomSalt(),hash=await derivePassword(p,Uint8Array.from(salt.match(/../g),byte=>parseInt(byte,16)));accounts[n]={salt,hash};localStorage.setItem(SNOX,JSON.stringify(accounts));state.account={name:n};save();closeModal();toast(state.language==='fr'?'Compte SNOX local créé':'Local SNOX account created');render()}else if(key&&accounts[key].salt&&accounts[key].hash){const salt=Uint8Array.from(accounts[key].salt.match(/../g),byte=>parseInt(byte,16)),hash=await derivePassword(p,salt);if(hash===accounts[key].hash){state.account={name:key};save();closeModal();toast(state.language==='fr'?'Connexion locale réussie':'Signed in locally');render()}else toast(state.language==='fr'?'Pseudo ou mot de passe incorrect':'Incorrect username or password')}else toast(state.language==='fr'?'Pseudo ou mot de passe incorrect':'Incorrect username or password')}catch(error){toast(state.language==='fr'?'Impossible de créer la session locale':'Could not create local session')}}
function render(){const views={home,play,guild,ranked,friends,chat,tutorial};shell(views[page]()||home())}render();
</script>
</body></html>
