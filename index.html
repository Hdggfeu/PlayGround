<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b1533" />
  <meta name="description" content="Snox Kingdom — bâtis ton royaume, entraîne ton armée et défends ton Snox ID." />
  <title>Snox Kingdom — Ton royaume, ton Snox ID</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="sky" aria-hidden="true">
      <div class="sun"></div>
      <div class="aurora aurora-a"></div>
      <div class="aurora aurora-b"></div>
      <div class="cloud cloud-a"><i></i><i></i><i></i></div>
      <div class="cloud cloud-b"><i></i><i></i><i></i></div>
      <div class="cloud cloud-c"><i></i><i></i><i></i></div>
      <div class="mist"></div>
    </div>

    <canvas id="game-canvas" aria-label="Royaume Snox"></canvas>
    <div class="canvas-vignette" aria-hidden="true"></div>

    <header id="hud" class="hud">
      <div class="hud-left">
        <button class="profile-card" id="profileBtn" aria-label="Ouvrir mon Snox ID">
          <span class="avatar-frame">
            <canvas id="avatarCanvas" width="112" height="112"></canvas>
            <span class="level-badge" id="levelBadge">1</span>
          </span>
          <span class="profile-copy">
            <span class="snox-tag"><i class="online-dot"></i> SNOX ID</span>
            <strong id="playerName">Chef Nova</strong>
            <span class="xp-track"><i id="xpFill"></i></span>
          </span>
          <span class="profile-chevron" aria-hidden="true">›</span>
        </button>
      </div>

      <div class="resource-bar" aria-label="Ressources">
        <button class="resource gold" id="goldBtn" title="Or">
          <span class="res-icon"><svg><use href="#i-coin"></use></svg></span>
          <span class="res-copy"><b id="goldAmount">0</b><small id="goldCap">/ 8 000</small></span>
          <span class="res-plus">+</span>
        </button>
        <button class="resource elixir" id="elixirBtn" title="Élixir">
          <span class="res-icon"><svg><use href="#i-drop"></use></svg></span>
          <span class="res-copy"><b id="elixirAmount">0</b><small id="elixirCap">/ 8 000</small></span>
          <span class="res-plus">+</span>
        </button>
        <button class="resource gems" id="gemsBtn" title="Gemmes">
          <span class="res-icon"><svg><use href="#i-gem"></use></svg></span>
          <span class="res-copy"><b id="gemsAmount">0</b><small>gemmes</small></span>
          <span class="res-plus">+</span>
        </button>
      </div>

      <div class="hud-actions">
        <div class="trophy-chip" title="Trophées">
          <svg><use href="#i-trophy"></use></svg>
          <b id="trophyAmount">0</b>
        </div>
        <button class="icon-btn" id="soundBtn" aria-label="Activer le son"><svg><use href="#i-sound-on"></use></svg></button>
        <button class="icon-btn" id="settingsBtn" aria-label="Réglages"><svg><use href="#i-settings"></use></svg></button>
      </div>
    </header>

    <aside class="quest-card" id="questCard">
      <div class="quest-head">
        <span class="quest-crest"><svg><use href="#i-scroll"></use></svg></span>
        <div><small>CHEMIN DU CHEF</small><strong>Objectifs du royaume</strong></div>
        <span class="quest-count" id="questCount">0/3</span>
      </div>
      <div class="quest-list" id="questList"></div>
      <button class="quest-collapse" id="questCollapse" aria-label="Réduire les objectifs">−</button>
    </aside>

    <button class="builder-chip" id="builderChip">
      <span class="builder-icon"><svg><use href="#i-hammer"></use></svg></span>
      <span><b id="buildersFree">2</b> artisans libres</span>
      <span class="builder-pulse" id="builderPulse"></span>
    </button>

    <div class="world-meta" id="worldMeta">
      <span class="world-dot"></span>
      <span>Royaume de <b id="realmName">Nova</b></span>
      <span class="meta-sep"></span>
      <span id="onlineCount">1 248 chefs en ligne</span>
    </div>

    <div class="zoom-controls" id="zoomControls">
      <button id="zoomIn" aria-label="Zoom avant">+</button>
      <button id="zoomOut" aria-label="Zoom arrière">−</button>
      <button id="recenter" aria-label="Recentrer"><svg><use href="#i-target"></use></svg></button>
    </div>

    <div class="build-bar" id="buildBar" hidden>
      <div class="build-copy">
        <span class="build-preview" id="buildPreview"></span>
        <span><small>MODE CONSTRUCTION</small><strong id="buildName">Bâtiment</strong></span>
      </div>
      <span class="build-hint">Touche une parcelle libre pour le placer</span>
      <div class="build-actions">
        <button class="btn ghost" id="cancelBuild">Annuler</button>
        <button class="btn gold" id="confirmBuild" disabled>Construire</button>
      </div>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="Navigation principale">
      <button class="nav-item active" data-view="village">
        <span class="nav-icon"><svg><use href="#i-home"></use></svg></span><span>Village</span>
      </button>
      <button class="nav-item" data-view="army">
        <span class="nav-icon"><svg><use href="#i-helmet"></use></svg></span><span>Armée</span>
      </button>
      <button class="nav-item" data-view="shop">
        <span class="nav-icon"><svg><use href="#i-shop"></use></svg></span><span>Boutique</span>
      </button>
      <button class="nav-item attack-nav" data-view="attack">
        <span class="nav-icon"><svg><use href="#i-swords"></use></svg></span><span>Attaque</span>
      </button>
      <button class="nav-item" data-view="clan">
        <span class="nav-icon"><svg><use href="#i-banner"></use></svg></span><span>Alliance</span>
      </button>
    </nav>

    <section class="sheet" id="sheet" aria-live="polite" hidden>
      <div class="sheet-grip" id="sheetGrip"></div>
      <button class="sheet-close" id="sheetClose" aria-label="Fermer"><svg><use href="#i-close"></use></svg></button>
      <div class="sheet-content" id="sheetContent"></div>
    </section>
    <div class="scrim" id="scrim" hidden></div>

    <div class="battle-hud" id="battleHud" hidden>
      <div class="battle-top">
        <button class="battle-exit" id="battleExit"><svg><use href="#i-close"></use></svg></button>
        <div class="battle-enemy">
          <span class="enemy-avatar" id="enemyAvatar"></span>
          <div><small>ADVERSAIRE</small><strong id="enemyName">Chef adverse</strong><span id="enemyTrophies">0 trophées</span></div>
        </div>
        <div class="battle-stars" id="battleStars">
          <span class="star" data-star="1">★</span><span class="star" data-star="2">★</span><span class="star" data-star="3">★</span>
        </div>
        <div class="battle-stats">
          <div class="stat-ring" id="destructionRing"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18"></circle><circle class="ring-fill" id="destructionArc" cx="22" cy="22" r="18"></circle></svg><b id="destructionPct">0%</b></div>
          <div class="battle-timer"><small>TEMPS</small><strong id="battleTimer">1:15</strong></div>
        </div>
      </div>
      <div class="battle-loot">
        <span><svg><use href="#i-coin"></use></svg><b id="battleGold">0</b></span>
        <span><svg><use href="#i-drop"></use></svg><b id="battleElixir">0</b></span>
        <span class="battle-tip" id="battleTip">Choisis une troupe puis touche le terrain</span>
      </div>
      <div class="troop-tray" id="troopTray"></div>
    </div>

    <div class="modal-root" id="modalRoot" hidden>
      <div class="modal-scrim"></div>
      <div class="modal" id="modal" role="dialog" aria-modal="true">
        <button class="modal-close" id="modalClose" aria-label="Fermer"><svg><use href="#i-close"></use></svg></button>
        <div id="modalContent"></div>
      </div>
    </div>

    <div class="toast-root" id="toastRoot"></div>
    <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

    <div class="boot" id="boot">
      <div class="boot-crest">
        <svg class="boot-crown"><use href="#i-crown"></use></svg>
        <span class="boot-ring"></span>
      </div>
      <div class="boot-word">SNOX<span>KINGDOM</span></div>
      <div class="boot-line"><i></i></div>
    </div>
  </div>

  <svg class="svg-defs" aria-hidden="true">
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.4" fill="currentColor"/><circle cx="12" cy="12" r="6.9" fill="none" stroke="rgba(98,53,0,.35)" stroke-width="1.2"/><path d="M12 7.6l1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4z" fill="#fff1b8"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2.6c3.9 5 7 8.5 7 12.1a7 7 0 1 1-14 0c0-3.6 3.1-7.1 7-12.1z" fill="currentColor"/><path d="M8.6 14.2c0 2.3 1.5 3.9 3.6 4.1" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-gem" viewBox="0 0 24 24"><path d="M7.2 3.6h9.6l4 6.1L12 21 3.2 9.7z" fill="currentColor"/><path d="M7.2 3.6l4.8 6.1 4.8-6.1M3.2 9.7h17.6M12 21L7.2 9.7M12 21l4.8-11.3" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3.5h10v4.2c0 4-2.2 6.6-5 6.9-2.8-.3-5-2.9-5-6.9z" fill="currentColor"/><path d="M7 5H4.2v2.1c0 2.3 1.6 3.8 4 4M17 5h2.8v2.1c0 2.3-1.6 3.8-4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 14.6v3.2M8.6 20.5h6.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.4l8 3.2v5.5c0 5-3.1 8.8-8 10.5-4.9-1.7-8-5.5-8-10.5V5.6z" fill="currentColor"/><path d="M12 6.2l4.2 1.7v3.4c0 2.9-1.6 5.2-4.2 6.4-2.6-1.2-4.2-3.5-4.2-6.4V7.9z" fill="rgba(0,0,0,.18)"/></symbol>
    <symbol id="i-swords" viewBox="0 0 24 24"><path d="M4 3.5l8.8 8.8-1.7 1.7L3.5 4.7zM20 3.5l-8.8 8.8 1.7 1.7 7.6-9.3z" fill="currentColor"/><path d="M3.5 17.2l3.3 3.3M20.5 17.2l-3.3 3.3M8 14.8l-3.4 3.4a1.7 1.7 0 1 0 2.4 2.4l3.4-3.4M16 14.8l3.4 3.4a1.7 1.7 0 1 1-2.4 2.4l-3.4-3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-hammer" viewBox="0 0 24 24"><path d="M14.5 3.2l6.3 6.3-3 3-6.3-6.3z" fill="currentColor"/><path d="M11 8.2l4.8 4.8-8 8a2.1 2.1 0 0 1-3-3z" fill="currentColor" opacity=".8"/><path d="M13.2 4.5l6.3 6.3" stroke="rgba(255,255,255,.4)" stroke-width="1.2"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 2.9l9 7.4-2.1 2.6-1.2-1v8.2H6.3v-8.2l-1.2 1L3 10.3z" fill="currentColor"/><path d="M9.6 20.1v-5.4h4.8v5.4" fill="rgba(0,0,0,.22)"/></symbol>
    <symbol id="i-helmet" viewBox="0 0 24 24"><path d="M4.2 12.3c0-4.7 3.5-8.1 7.8-8.1s7.8 3.4 7.8 8.1v1.3H4.2z" fill="currentColor"/><path d="M6.1 13.6h11.8v2.3c0 3.2-2.6 5.2-5.9 5.2s-5.9-2-5.9-5.2z" fill="currentColor" opacity=".72"/><path d="M12 4.6v9M4.2 12.3h15.6" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/></symbol>
    <symbol id="i-shop" viewBox="0 0 24 24"><path d="M4.3 8.6h15.4l1 11.4H3.3z" fill="currentColor"/><path d="M8.1 9.2V6.6a3.9 3.9 0 0 1 7.8 0v2.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7.2 13.4h9.6M7.6 16.5h8.8" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/></symbol>
    <symbol id="i-banner" viewBox="0 0 24 24"><path d="M6 2.8h12v18l-6-3.3-6 3.3z" fill="currentColor"/><path d="M9 6.6h6M9 9.8h4.5" stroke="rgba(255,255,255,.4)" stroke-width="1.2" stroke-linecap="round"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M13.9 2.7l.6 2.4c.5.2 1 .5 1.5.9l2.3-.9 1.5 2.6-1.8 1.7c.1.6.1 1.1 0 1.7l1.8 1.7-1.5 2.6-2.3-.9c-.5.4-1 .7-1.5.9l-.6 2.4h-3.8l-.6-2.4c-.5-.2-1-.5-1.5-.9l-2.3.9L4.2 14l1.8-1.7a8 8 0 0 1 0-1.7L4.2 8.9l1.5-2.6 2.3.9c.5-.4 1-.7 1.5-.9l.6-2.4z" fill="currentColor"/><circle cx="12" cy="10.8" r="3" fill="rgba(0,0,0,.3)"/></symbol>
    <symbol id="i-sound-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.4a5 5 0 0 1 0 7.2M18.7 5.7a8.6 8.6 0 0 1 0 12.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5.6 4.2L12 10.6l6.4-6.4 1.8 1.8-6.4 6.4 6.4 6.4-1.8 1.8-6.4-6.4-6.4 6.4-1.8-1.8 6.4-6.4-6.4-6.4z" fill="currentColor"/></symbol>
    <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M6.2 3.2h11.6c1.4 0 2.4 1 2.4 2.4v1.2h-2.3v-1c0-.4-.2-.6-.6-.6H7.7c.5.5.8 1.1.8 1.9v11.1c0 1.4-1 2.4-2.4 2.4S3.7 19.6 3.7 18.2V8.2h2.3v10c0 .4.2.6.6.6s.6-.2.6-.6V6.6c0-1.9 1.4-3.4 3.4-3.4z" fill="currentColor"/><path d="M9.5 7.2h8.2M9.5 10.3h8.2M9.5 13.4h5.8" stroke="rgba(255,255,255,.4)" stroke-width="1.2" stroke-linecap="round"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 7.2l4.6 3.5L12 4l4.4 6.7L21 7.2l-1.7 10.5H4.7z" fill="currentColor"/><path d="M4.7 17.7h14.6v2.1H4.7z" fill="currentColor" opacity=".65"/><circle cx="12" cy="14.4" r="1.2" fill="rgba(255,255,255,.55)"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 1.8v3.1M12 19.1v3.1M1.8 12h3.1M19.1 12h3.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6.6V12l3.8 2.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.6 1.8L4.8 13h6l-1.4 9.2L19.2 11h-6.1z" fill="currentColor"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.4l5 5L20 6.8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M10.2 3.5h3.6v6.7h6.7v3.6h-6.7v6.7h-3.6v-6.7H3.5v-3.6h6.7z" fill="currentColor"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M13.2 4.8l7.2 7.2-7.2 7.2-2.5-2.5 4.9-4.7-4.9-4.7z" fill="currentColor"/><path d="M3.5 10.6h11.4v2.8H3.5z" fill="currentColor"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.4" y="10.2" width="15.2" height="10.8" rx="2" fill="currentColor"/><path d="M7.8 10.2V7.4a4.2 4.2 0 0 1 8.4 0v2.8" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="15.3" r="1.5" fill="rgba(0,0,0,.35)"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.4" r="3.4" fill="currentColor"/><path d="M2.8 20c0-3.5 2.7-6.2 6.2-6.2s6.2 2.7 6.2 6.2z" fill="currentColor"/><circle cx="17.2" cy="9.2" r="2.5" fill="currentColor" opacity=".7"/><path d="M15.7 14.1c3.1-.4 5.5 1.9 5.5 5.1h-4.3" fill="currentColor" opacity=".7"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.8 6 6.5.7-4.9 4.4 1.4 6.4-5.8-3.3-5.8 3.3 1.4-6.4-4.9-4.4 6.5-.7z" fill="currentColor"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.3" fill="currentColor"/><path d="M12 10.1v6.2M12 6.5v.2" stroke="rgba(0,0,0,.5)" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.3" y="3.2" width="12.4" height="14.6" rx="2.4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.7 20.8H5.6a2.4 2.4 0 0 1-2.4-2.4V8.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12.5 7.8h4.2M12.5 11h4.2M12.5 14.2h2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  </svg>

  <script type="module" src="js/game.js"></script>
</body>
</html>
