<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
let state=JSON.parse(localStorage.getItem('riftbound-save')||'null')||{lp:72,wins:14,matches:25,streak:3,honor:92,guildWins:38,language:'en',friends:['Mira','Thorne'],tutorialDone:false};
const save=()=>localStorage.setItem('riftbound-save',JSON.stringify(state));
const T={
 en:{home:'Home',play:'Play',guild:'Guild',ranked:'Ranked',friends:'Friends',tutorial:'Tutorial',welcome:'WELCOME BACK, PLAYER',hero:'The climb to Gold begins here.',herosub:'Sharpen your tactics, rally your guild, and earn your place in the ranked arena.',rankNow:'PLAY RANKED',overview:'Season overview',gold:'Gold League',promotion:'Promotion progress',wins:'Wins',matches:'Matches',streak:'Win streak',guild:'The Golden Wyrms',guildsub:'Guild level 12 · 48 members',viewGuild:'View guild',online:'Friends online',tutorialTitle:'Learn the Rift',tutorialSub:'Four lessons to master the arena',viewTutorial:'Open tutorial',rankName:'Gold II',playTitle:'Ranked duel',rankedMode:'GOLD II · SOLO',choose:'Choose champion',start:'Start duel',actions:['Strike','Guard','Ability','Ultimate'],you:'You',enemy:'Rival',combatLog:'Combat log',guildTitle:'Guild Hall',members:'Members',activity:'Guild activity',invite:'Invite member',invitePlaceholder:'Player name',send:'Send invite',complete:'Complete',lessons:['The battlefield','Combat basics','Rank progression','Guild cooperation'],lessonText:['Choose a champion and read enemy health before committing.','Strike builds pressure; Guard reduces damage; abilities can turn the duel.','Wins add LP and losses remove LP. Reach 100 LP for promotion.','Guild wins contribute to shared progress and team rewards.']},
 fr:{home:'Accueil',play:'Jouer',guild:'Guilde',ranked:'Classé',friends:'Amis',tutorial:'Tutoriel',welcome:'BON RETOUR, JOUEUR',hero:'L’ascension vers l’Or commence ici.',herosub:'Affûte tes tactiques, rallie ta guilde et gagne ta place dans l’arène.',rankNow:'JOUER EN CLASSÉ',overview:'Vue de la saison',gold:'Ligue Or',promotion:'Progression de promotion',wins:'Victoires',matches:'Matchs',streak:'Série de victoires',guild:'Les Wyrms dorés',guildsub:'Guilde niveau 12 · 48 membres',viewGuild:'Voir la guilde',online:'Amis en ligne',tutorialTitle:'Apprendre la Faille',tutorialSub:'Quatre leçons pour maîtriser l’arène',viewTutorial:'Ouvrir le tutoriel',rankName:'Or II',playTitle:'Duel classé',rankedMode:'OR II · SOLO',choose:'Choisir un champion',start:'Commencer',actions:['Frappe','Garde','Aptitude','Ultime'],you:'Vous',enemy:'Adversaire',combatLog:'Journal du combat',guildTitle:'Salle de guilde',members:'Membres',activity:'Activité de guilde',invite:'Inviter un membre',invitePlaceholder:'Nom du joueur',send:'Envoyer',complete:'Terminer',lessons:['Le champ de bataille','Bases du combat','Progression classée','Coopération de guilde'],lessonText:['Choisis un champion et surveille la santé adverse.','Frappe augmente la pression; Garde réduit les dégâts; les aptitudes retournent un duel.','Les victoires ajoutent des LP; les défaites en retirent. Atteins 100 LP pour être promu.','Les victoires de guilde contribuent aux récompenses communes.']}
};
let page='home',selected=0,battle=null;
const champs=[['⚔','Kael','Vanguard'],['✦','Lyra','Mage'],['♜','Orrin','Guardian'],['☄','Vex','Assassin']];
const navs=[['home','◆'],['play','⚔'],['guild','♜'],['ranked','▲'],['friends','●'],['tutorial','?']];
function t(k){return T[state.language][k]||k}
function shell(content){
 let nav=navs.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span class="ico">${i}</span><span>${t(n==='ranked'||n==='friends'?n:n)}</span></button>`).join('');
 document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">R</div><div><strong>RIFTBOUND</strong><small>GUILD & RANKED</small></div></div><div class="nav-label">${state.language==='fr'?'AVENTURE':'ADVENTURE'}</div><div class="nav">${nav}</div><div class="side-bottom"><div class="season-mini"><small>${state.language==='fr'?'SAISON 4':'SEASON 4'}</small><b>${t('gold')}</b><div class="bar"><i style="width:${state.lp}%"></i></div></div></div></aside><main class="main"><header class="topbar"><div></div><div class="topbar-actions"><button class="lang-btn" onclick="toggleLang()">${state.language==='en'?'FR':'EN'}</button><button class="icon-btn">◉</button><div class="avatar">P</div></div></header>${content}</div>`;
}
function go(p){page=p==='ranked'?'ranked':p;render()}
function toggleLang(){state.language=state.language==='en'?'fr':'en';save();render()}
function home(){return `<section class="hero"><div class="hero-content"><div class="eyebrow">${t('welcome')}</div><h1>${t('hero')}</h1><p>${t('herosub')}</p><button class="button primary" onclick="go('play')">${t('rankNow')} →</button></div></section><div class="section-head"><h2>${t('overview')}</h2></div><div class="dashboard-grid"><div class="stack"><div class="rank-card"><div class="rank-emblem">◆</div><div class="rank-info"><small>${t('gold')}</small><h2>${t('rankName')}</h2><div class="rank-points"><b>${state.lp} LP</b><span>${t('promotion')}</span></div><div class="bar" style="margin-top:9px"><i style="width:${state.lp}%"></i></div></div></div><div class="stat-row"><div class="stat"><small>${t('wins')}</small><b>${state.wins}</b></div><div class="stat"><small>${t('matches')}</small><b>${state.matches}</b></div><div class="stat"><small>${t('streak')}</small><b>${state.streak}</b></div></div></div><div class="stack"><div class="card"><h3>${t('guild')}</h3><div class="guild-mini"><div class="guild-crest">♜</div><div><b>${t('guild')}</b><small>${t('guildsub')}</small></div></div><button class="button gold" style="margin-top:14px;width:100%" onclick="go('guild')">${t('viewGuild')}</button></div><div class="card"><h3>${t('tutorialTitle')}</h3><p style="color:var(--muted);font-size:11px">${t('tutorialSub')}</p><button class="button teal" style="width:100%" onclick="go('tutorial')">${t('viewTutorial')}</button></div></div></div>`}
function play(){if(!battle)battle={hp:100,ehp:100,turn:1,log:[state.language==='fr'?'Le duel commence.':'The duel begins.']};return `<div class="section-head"><h2>${t('playTitle')}</h2><small>${t('rankedMode')}</small></div><div class="section-head" style="margin-top:0"><small>${t('choose')}</small></div><div class="pick-grid">${champs.map((c,i)=>`<button class="champion ${selected===i?'active':''}" onclick="pick(${i})"><div class="champ-icon">${c[0]}</div><b>${c[1]}</b><small>${c[2]}</small></button>`).join('')}</div><div class="play-layout" style="margin-top:15px"><div class="arena"><div class="arena-top"><small>GOLD ARENA · ROUND ${battle.turn}</small><span class="live">● LIVE</span></div><div class="battlefield"><div class="fighter"><div class="fighter-portrait">${champs[selected][0]}</div><div class="fighter-detail"><div class="fighter-label">${champs[selected][1]} <small>· ${t('you')}</small></div><div class="health"><i id="php" style="width:${battle.hp}%"></i></div><small class="health small">${battle.hp}/100</small></div></div><div class="fighter enemy"><div class="fighter-portrait">☠</div><div class="fighter-detail"><div class="fighter-label">Mordek · ${t('enemy')}</div><div class="health"><i id="ehp" style="width:${battle.ehp}%"></i></div><small>${battle.ehp}/100</small></div></div></div><div class="action-row">${t('actions').map((a,i)=>`<button class="button ${i===3?'gold':''}" onclick="action(${i})" ${battle.hp<=0||battle.ehp<=0?'disabled':''}>${a}</button>`).join('')}</div></div><div class="card"><h3>${t('combatLog')}</h3><div class="log">${battle.log.map(x=>`<div class="log-line">${x}</div>`).join('')}</div><button class="button" style="width:100%;margin-top:9px" onclick="battle=null;render()">${state.language==='fr'?'Nouveau duel':'New duel'}</button></div></div>`}
function pick(i){selected=i;if(battle)battle={hp:100,ehp:100,turn:1,log:[state.language==='fr'?'Le duel commence.':'The duel begins.']};render()}
function action(i){if(!battle||battle.hp<=0||battle.ehp<=0)return;let dmg=[14,0,22,38][i],guard=i===1;if(i===3)dmg=30+Math.floor(Math.random()*9);battle.ehp=Math.max(0,battle.ehp-dmg);let enemy=guard?4:8+Math.floor(Math.random()*13);battle.hp=Math.max(0,battle.hp-enemy);battle.turn++;battle.log.unshift(`${champs[selected][1]} ${t('actions')[i]}: ${dmg} ${state.language==='fr'?'dégâts':'damage'}`);if(battle.ehp<=0||battle.hp<=0){finish(battle.ehp<=0,battle.hp<=0)}render()}
function finish(win,tied){state.matches++;if(win){state.wins++;state.lp=Math.min(100,state.lp+18);state.guildWins++;state.streak++;battle.log.unshift(state.language==='fr'?'Victoire ! +18 LP':'Victory! +18 LP')}else if(!tied){state.lp=Math.max(0,state.lp-12);state.streak=0;battle.log.unshift(state.language==='fr'?'Défaite. -12 LP':'Defeat. -12 LP')}else battle.log.unshift(state.language==='fr'?'Match nul':'Draw');save()}
function guild(){return `<div class="guild-banner"><div><small>GUILD 12</small><h1>${t('guild')}</h1><div style="color:var(--muted);font-size:11px">${t('guildsub')}</div></div><button class="button gold" onclick="openModal('guild')">${t('invite')}</button></div><div class="guild-grid"><div class="card"><h3>${t('members')}</h3>${[['Lyra','Guild Master','◇','Online'],['Thorne','Officer','◈','In arena'],['Mira','Member','✦','Online'],['Orin','Member','♜','Offline']].map(m=>`<div class="member-row"><div class="avatar">${m[2]}</div><div><b>${m[0]}</b><small>${m[3]}</small></div><span class="role">${m[1]}</span></div>`).join('')}</div><div class="card"><h3>${t('activity')}</h3><div class="log-line">${state.guildWins} ${state.language==='fr'?'victoires de guilde':'guild victories'}</div><div class="log-line">Lyra ${state.language==='fr'?'a atteint l’Or I':'reached Gold I'}</div><div class="log-line">Thorne ${state.language==='fr'?'a invité Mira':'invited Mira'}</div></div></div>`}
function friends(){return `<div class="section-head"><h2>${t('friends')}</h2><button class="button" onclick="openModal('friend')">${state.language==='fr'?'Ajouter':'Add friend'}</button></div><div class="card" style="max-width:700px">${[['Mira','In ranked','◆'],['Thorne','In arena','♜'],['Lyra','Online','✦'],...state.friends.filter(f=>!['Mira','Thorne','Lyra'].includes(f)).map(f=>[f,'Online','●'])].map(f=>`<div class="friend-row"><div class="avatar">${f[2]}</div><div><b>${f[0]}</b><small>${f[1]}</small></div><span class="online"></span></div>`).join('')}</div>`}
function ranked(){return guildRanked()}
function guildRanked(){const names=['Aurel','Seren','Thorne','Mira','Kael','Lyra'];return `<div class="section-head"><h2>${t('ranked')}</h2><small>${t('rankName')} · ${state.lp} LP</small></div><div class="card"><table class="table"><thead><tr><th>#</th><th>${state.language==='fr'?'Joueur':'Player'}</th><th>LP</th><th>${state.language==='fr'?'Division':'Division'}</th></tr></thead><tbody>${names.map((n,i)=>`<tr class="${i===3?'you':''}"><td>${i+1}</td><td>${n}${i===3?' (You)':''}</td><td>${98-i*7}</td><td>${i<3?'Gold I':'Gold II'}</td></tr>`).join('')}</tbody></table></div>`}
function tutorial(){return `<div class="section-head"><h2>${t('tutorialTitle')}</h2><small>${t('tutorialSub')}</small></div><div class="tutorial-grid">${[0,1,2,3].map(i=>`<div class="lesson"><div class="lesson-icon">${['◆','⚔','▲','♜'][i]}</div><div><h3>${t('lessons')[i]}</h3><p>${t('lessonText')[i]}</p></div></div>`).join('')}</div><button class="button primary" style="margin-top:16px" onclick="completeTutorial()">${t('complete')}</button>`}
function completeTutorial(){state.tutorialDone=true;save();toast(state.language==='fr'?'Tutoriel terminé !':'Tutorial completed!')}
function openModal(kind){const isGuild=kind==='guild';document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="modal-back show" id="modal"><div class="modal"><h2>${isGuild?t('invite'):state.language==='fr'?'Ajouter un ami':'Add friend'}</h2><input id="modalInput" placeholder="${isGuild?t('invitePlaceholder'):state.language==='fr'?'Nom d’un joueur':'Player name'}"><div class="modal-actions"><button class="button" onclick="closeModal()">${state.language==='fr'?'Annuler':'Cancel'}</button><button class="button primary" onclick="sendInvite('${kind}')">${isGuild?t('send'):state.language==='fr'?'Ajouter':'Add'}</button></div></div></div>`)}
function closeModal(){let m=$('#modal');if(m)m.remove()}
function sendInvite(kind){let v=$('#modalInput')?.value.trim();if(!v){toast(state.language==='fr'?'Entre un nom':'Enter a name');return}if(kind==='friend'&&!state.friends.includes(v)){state.friends.push(v);save()}closeModal();toast(isFrench()?(kind==='friend'?'Ami ajouté':'Invitation envoyée'):(kind==='friend'?'Friend added':'Invitation sent'));render()}
function isFrench(){return state.language==='fr'}
function toast(msg){let el=document.query('.toast');if(!el){document.body.insertAdjacentHTML('beforeend','<div class="toast"></div>');el=document.query('.toast')}el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function render(){let views={home,play,guild,ranked,ranked:ranked,ranked:ranked,friends,tutorial};shell(views[page]())}
render();
</script>
</body></html>
