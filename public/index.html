<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SNOW ID — Course infinie</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Manrope:wght@600;800&display=swap');
:root{--ink:#071422;--cyan:#55d7ed;--lime:#d7ff35;--snow:#eefaff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Manrope,Arial,sans-serif;background:#071422;color:var(--ink)}
#app{position:relative;width:100%;height:100%;background:linear-gradient(#9bdbe8 0 42%,#f8fbfa 42%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{position:absolute;z-index:3}.hidden{display:none!important}.topbar{top:18px;left:22px;right:22px;height:58px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.brand{font-family:'Black Ops One';font-size:25px;letter-spacing:-1px;color:#071422;text-shadow:0 2px #fff}.brand small{display:block;font-family:Manrope;font-size:9px;letter-spacing:4px;margin-top:-3px}.hud-right{display:flex;gap:8px}.chip{height:42px;background:rgba(238,250,255,.88);border:2px solid rgba(7,20,34,.12);border-radius:12px;padding:7px 12px;box-shadow:0 5px 18px rgba(30,90,110,.12);font-size:10px;text-transform:uppercase;letter-spacing:1px}.chip b{display:block;font-size:18px;line-height:19px}.coinchip{color:#0e6f79}.coinchip:before{content:'●';color:#e1b52d;margin-right:6px}.speedchip{min-width:82px}.speedchip b{color:#167b91}
.card{top:50%;left:50%;transform:translate(-50%,-50%);width:min(410px,calc(100% - 32px));padding:28px 28px 24px;border:1px solid rgba(255,255,255,.75);border-radius:24px;background:rgba(239,249,251,.94);box-shadow:0 24px 70px rgba(21,62,82,.28);backdrop-filter:blur(12px)}.card h1{font-family:'Black Ops One';font-size:38px;margin:0 0 4px;line-height:1}.card .sub{margin:0 0 20px;color:#54717c;font-size:13px}.tabs{display:flex;gap:6px;margin-bottom:16px}.tab{flex:1;border:0;border-radius:10px;padding:10px;background:#dbeaed;font:800 12px Manrope;cursor:pointer}.tab.active{background:var(--ink);color:white}.field{margin-bottom:10px}.field label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;margin:0 0 5px}.field input{width:100%;height:48px;border:2px solid #bfd3d8;border-radius:11px;background:white;padding:0 14px;font:800 15px Manrope;outline:none}.field input:focus{border-color:#55bdd0}.error{min-height:18px;color:#bd3e3b;font-size:11px}.primary{width:100%;height:52px;border:0;border-radius:12px;background:var(--lime);box-shadow:0 5px 0 #9ebd25;font:800 15px Manrope;color:var(--ink);cursor:pointer}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #9ebd25}.bestbox{display:flex;justify-content:space-between;margin-top:18px;border-top:1px solid #cbdce0;padding-top:14px;font-size:11px;color:#66808a}.bestbox b{font-size:15px;color:var(--ink)}
#pauseBtn,#soundBtn{pointer-events:auto;border:0;width:42px;height:42px;border-radius:12px;background:rgba(238,250,255,.88);font-size:18px;cursor:pointer;box-shadow:0 5px 18px rgba(30,90,110,.12)}
.controls{bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:12px}.control{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:rgba(8,24,36,.16);color:white;font-size:23px;box-shadow:0 5px 20px rgba(24,70,90,.12);touch-action:none;backdrop-filter:blur(4px)}.control.jump{width:76px;height:76px;margin-top:-12px;background:rgba(215,255,53,.9);color:var(--ink)}
.overlay-card{text-align:center}.overlay-card h1{font-size:44px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.stat{background:white;border-radius:12px;padding:12px}.stat span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#71878f}.stat b{font-size:22px}.actions{display:flex;gap:8px}.actions button{flex:1}.secondary{border:2px solid #bcd1d5;background:white;border-radius:12px;font:800 13px Manrope;color:var(--ink)}
.toast{position:absolute;z-index:5;left:50%;top:92px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:white;border-radius:30px;padding:9px 15px;font-size:12px;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:600px){.topbar{top:10px;left:12px;right:12px}.brand{font-size:20px}.chip{height:38px;padding:5px 8px}.speedchip{display:none}.controls{bottom:10px}.control{width:58px;height:58px}.card{padding:23px 22px}.card h1{font-size:32px}}
</style>
</head>
<body><div id="app">
<canvas id="game"></canvas>
<div class="topbar panel" id="topbar"><div class="brand">SNOW ID<small>FROZEN RUN</small></div><div class="hud-right"><div class="chip coinchip">Pièces <b id="coinsHud">0</b></div><div class="chip speedchip">Vitesse <b id="speedHud">0</b></div><button id="soundBtn" title="Son">♪</button><button id="pauseBtn" title="Pause">Ⅱ</button></div></div>
<section class="card panel" id="auth">
<h1>SNOW ID</h1><p class="sub">Connecte-toi ou crée ton rider.</p>
<div class="tabs"><button class="tab active" data-tab="login">Connexion</button><button class="tab" data-tab="signup">Inscription</button></div>
<form id="authForm"><div class="field"><label>Nom d'utilisateur</label><input id="username" autocomplete="username" maxlength="16" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" required></div><div class="error" id="error"></div><button class="primary" type="submit" id="authSubmit">ENTRER SUR LA PISTE</button></form>
<div class="bestbox"><span>Meilleur score</span><b id="authBest">0 m</b></div>
</section>
<section class="card panel overlay-card hidden" id="gameOver"><h1>FIN DE COURSE</h1><div class="stats"><div class="stat"><span>Distance</span><b id="finalDist">0 m</b></div><div class="stat"><span>Pièces</span><b id="finalCoins">0</b></div></div><div class="actions"><button class="secondary" id="logoutBtn">Déconnexion</button><button class="primary" id="restartBtn">REJOUER</button></div></section>
<section class="card panel overlay-card hidden" id="pause"><h1>PAUSE</h1><p class="sub">La montagne attend.</p><div class="actions"><button class="secondary" id="quitBtn">Quitter</button><button class="primary" id="resumeBtn">REPRENDRE</button></div></section>
<div class="controls panel" id="controls"><button class="control" id="leftBtn">←</button><button class="control jump" id="jumpBtn">↑</button><button class="control" id="rightBtn">→</button></div><div class="toast" id="toast"></div>
</div>
<script src="game.js"></script>
</body></html>
